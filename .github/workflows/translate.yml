# 自动翻译：你发布（不是草稿）一篇文章或测验后，如果它还没有另一种语言的版本，
# Claude 会帮你翻译，存成「草稿」。你在 Pages CMS 检查一下，取消勾选「草稿」再保存，就会发布。
# 需要在 GitHub 仓库的 Settings → Secrets 里放 CLAUDE_CODE_OAUTH_TOKEN（用 claude setup-token 产生）。
name: Auto-translate posts & quizzes

on:
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**'
      - 'src/content/quizzes/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: find
        run: node scripts/find-missing-twins.mjs

      - if: steps.find.outputs.count != '0' && env.HAS_TOKEN != 'true'
        run: echo "::warning::Some content needs translating, but the CLAUDE_CODE_OAUTH_TOKEN secret is not set."

      - if: steps.find.outputs.count != '0' && env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Read,Write,Glob'
          prompt: |
            You are translating content for 金釘子 GoldenSpike, a bilingual (Simplified Chinese / English)
            geology and seismology blog by a Malaysian geologist doing seismology research at Kyoto University.

            Translate each source file below and WRITE the translation to the target path.
            Do not change any other file.

            ${{ steps.find.outputs.pairs }}

            Rules for blog posts (.md with YAML frontmatter):
            - Keep these fields exactly the same: slug, date, category, cover, youtubeId.
            - Set `lang` to the target language and set `draft: true`.
            - Translate: title, description, coverAlt, tags, and the Markdown body.
            - Keep the Markdown structure exactly: headings, lists, quotes, links, images (keep image paths unchanged).

            Rules for quizzes (.json):
            - Keep slug, order, youtubeId, and every `answer` number exactly the same. Keep option order unchanged.
            - Set "lang" to the target language and add "draft": true.
            - Translate: title, description, question, options, explanation. Output valid JSON, 2-space indent.

            Style:
            - Natural, friendly, clear writing for general readers (the original is popular science, not a paper).
              Translate the meaning, not word-by-word. Keep the author's voice and any humour.
            - Use correct geological/seismological terminology.
              In Chinese, follow the author's habit: on first mention give the English term in parentheses, e.g. 花岗岩（Granite）.
              In English, drop such parenthetical Chinese/English duplicates.
            - Malaysian place names in Malay spelling (Segamat, Bukit Tinggi, Johor); Japanese places in standard romanisation (Noto, Kyoto).
            - Chinese output must be Simplified Chinese with full-width punctuation.

      - name: Save translations
        if: steps.find.outputs.count != '0' && env.HAS_TOKEN == 'true'
        run: |
          git add src/content/posts src/content/quizzes
          if git diff --cached --quiet; then echo "No new files."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-translate (draft): $(git diff --cached --name-only | xargs -n1 basename | tr '\n' ' ')"
          git push
